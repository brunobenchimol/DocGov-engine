name: Continuous Integration - DocGov Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            build_script: bun run build:linux
            binary_name: docgov-engine
            run_cmd: ./bin/docgov-engine
            install_cmd: bash ./scripts/install.sh ./test_install_linux
            installed_bin: ./test_install_linux/docgov-engine
          - os: windows-latest
            build_script: bun run build:windows
            binary_name: docgov-engine.exe
            run_cmd: ./bin/docgov-engine.exe
            install_cmd: pwsh -File ./scripts/install.ps1 ./test_install_win
            installed_bin: ./test_install_win/docgov-engine.exe

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependências
        run: bun install

      - name: Executar Testes Unitários
        run: bun test

      - name: Compilar Binário Standalone
        run: ${{ matrix.build_script }}

      - name: Smoke Test - Validar Execução da CLI Compilada
        shell: bash
        run: |
          bun run ./scripts/smoke_test_fixture.ts
          ${{ matrix.run_cmd }} --version
          ${{ matrix.run_cmd }} -v
          ${{ matrix.run_cmd }} --help
          ${{ matrix.run_cmd }} --check-update
          ${{ matrix.run_cmd }} --inspect smoke_test/tpl.docx --out smoke_test/inspect.json --compact
          test -f smoke_test/inspect.json && echo "Smoke Test Inspect Aprovado!"
          ${{ matrix.run_cmd }} --bootstrap-case --case-dir smoke_test/case_ci --uploads-dir smoke_test
          test -f smoke_test/case_ci/state/estrutura_tpl.json && echo "Smoke Test Bootstrap Case Aprovado!"
          ${{ matrix.run_cmd }} --generate-audit-docx --audit-json smoke_test/audit.json --out smoke_test/audit_out.docx
          test -f smoke_test/audit_out.docx && echo "Smoke Test Generate Audit Docx Aprovado!"
          ${{ matrix.run_cmd }} --template smoke_test/tpl.docx --state smoke_test/st.json --out smoke_test/out.docx
          test -f smoke_test/out.docx && echo "Smoke Test Aprovado: Binário standalone gerou o documento com sucesso!"

      - name: Smoke Test do Instalador Oficial (Distribution Validation)
        shell: bash
        run: |
          ${{ matrix.install_cmd }}
          ${{ matrix.installed_bin }} --version
          rm -rf test_install_*
