name: Continuous Integration - Docx Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            build_script: bun run build:linux
            binary_name: docgov-docx
            run_cmd: ./bin/docgov-docx
          - os: windows-latest
            build_script: bun run build:windows
            binary_name: docgov-docx.exe
            run_cmd: ./bin/docgov-docx.exe

    steps:
      - name: Checkout Código
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependências
        run: bun install

      - name: Executar Testes Unitários
        run: bun test

      - name: Compilar Binário Standalone
        run: ${{ matrix.build_script }}

      - name: Smoke Test - Validar Execução da CLI Compilada
        shell: bash
        run: |
          mkdir -p smoke_test
          node -e "
            const fs = require('fs');
            const b64 = '';
            fs.writeFileSync('smoke_test/tpl.docx', Buffer.from(b64, 'base64'));
            fs.writeFileSync('smoke_test/st.json', JSON.stringify({processo_id: 'CI-TEST', objeto: {descricao: 'Teste CI'}}));
          "
          ${{ matrix.run_cmd }} --version
          ${{ matrix.run_cmd }} -v
          ${{ matrix.run_cmd }} --help
          ${{ matrix.run_cmd }} --inspect smoke_test/tpl.docx --out smoke_test/inspect.json
          test -f smoke_test/inspect.json && echo "Smoke Test Inspect Aprovado!"
          ${{ matrix.run_cmd }} --template smoke_test/tpl.docx --state smoke_test/st.json --out smoke_test/out.docx
          test -f smoke_test/out.docx && echo "Smoke Test Aprovado: Binário standalone gerou o documento com sucesso!"

