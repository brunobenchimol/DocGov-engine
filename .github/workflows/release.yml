name: Release DocGov Engine Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de release para compilar e publicar (ex: v1.2.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: docgov-engine-linux-x64
            build_script: bun run build:linux
            binary_path: bin/docgov-engine
          - os: windows-latest
            artifact_name: docgov-engine-win-x64.exe
            build_script: bun run build:windows
            binary_path: bin/docgov-engine.exe

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependências
        run: bun install

      - name: Executar Testes Unitários
        run: bun test

      - name: Compilar Binário Standalone
        run: ${{ matrix.build_script }}

      - name: Renomear Binário para Release
        shell: bash
        run: |
          mkdir -p dist-release
          cp ${{ matrix.binary_path }} dist-release/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/${{ matrix.artifact_name }}

  release:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Preparar Binários e Gerar Checksums SHA-256
        shell: bash
        run: |
          mkdir -p dist-release
          cp artifacts/docgov-engine-linux-x64/docgov-engine-linux-x64 dist-release/docgov-engine-linux-x64
          cp artifacts/docgov-engine-win-x64.exe/docgov-engine-win-x64.exe dist-release/docgov-engine-win-x64.exe
          
          cd dist-release
          sha256sum docgov-engine-linux-x64 docgov-engine-win-x64.exe > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt GERADO NA CI ==="
          cat SHA256SUMS.txt

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist-release/docgov-engine-linux-x64
            dist-release/docgov-engine-win-x64.exe
            dist-release/SHA256SUMS.txt
          generate_release_notes: true
