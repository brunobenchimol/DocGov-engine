name: Release DocGov Engine Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: docgov-engine-linux-x64
            build_script: bun run build:linux
            binary_path: bin/docgov-engine
          - os: windows-latest
            artifact_name: docgov-engine-win-x64.exe
            build_script: bun run build:windows
            binary_path: bin/docgov-engine.exe

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependências
        run: bun install

      - name: Executar Testes Unitários
        run: bun test

      - name: Compilar Binário Standalone
        run: ${{ matrix.build_script }}

      - name: Renomear Binário para Release
        shell: bash
        run: |
          mkdir -p dist-release
          cp ${{ matrix.binary_path }} dist-release/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-release/${{ matrix.artifact_name }}

  release:
    name: Publicar GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/docgov-engine-linux-x64/docgov-engine-linux-x64
            artifacts/docgov-engine-win-x64.exe/docgov-engine-win-x64.exe
          generate_release_notes: true
